version: "3.8"

# ─── Infrastructure ─────────────────────────────────────────────────────────────

services:

  db:
    container_name: goldgym-db
    image: mysql:8.0
    ports:
      - "3306:3306"
    environment:
      MYSQL_DATABASE: goldgym
      MYSQL_ROOT_PASSWORD: root
      MYSQL_ROOT_HOST: "%"
    volumes:
      - .data/db:/var/lib/mysql
    command: --default-authentication-plugin=mysql_native_password
    labels:
      - "SERVICE_IGNORE=true"

  redis:
    container_name: goldgym-redis
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - .data/redis:/data
    labels:
      - "SERVICE_IGNORE=true"

  rabbitmq:
    container_name: goldgym-rabbitmq
    image: rabbitmq:3-management-alpine
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    volumes:
      - .data/rabbitmq:/var/lib/rabbitmq
    labels:
      - "SERVICE_IGNORE=true"

  mailcatcher:
    container_name: goldgym-mailcatcher
    image: schickling/mailcatcher
    ports:
      - "1080:1080"
      - "1025:1025"
    labels:
      - "SERVICE_IGNORE=true"

  # ─── Reverse Proxy ──────────────────────────────────────────────────────────

  reverse-proxy:
    container_name: goldgym-reverse-proxy
    image: nginx:1.25-alpine
    ports:
      - "80:80"
    volumes:
      - ./servers/reverse-proxy/templates/proxy.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - users
      - members
    labels:
      - "SERVICE_IGNORE=true"

  # ─── Go Microservices ────────────────────────────────────────────────────────

  users:
    container_name: goldgym-users
    build:
      context: ./servers/gobase
      args:
        APP_NAME: users
    env_file:
      - app.env
    environment:
      APP_NAME: users
      HOST: 0.0.0.0
      PORT: 8080
    volumes:
      - ./workspace/users:/app/users
      - ./pkg:/pkg
    ports:
      - "${USERS_PORT:-8081}:8080"
    depends_on:
      - db
      - redis
      - rabbitmq
    links:
      - db
      - redis
      - rabbitmq

  members:
    container_name: goldgym-members
    build:
      context: ./servers/gobase
      args:
        APP_NAME: members
    env_file:
      - app.env
    environment:
      APP_NAME: members
      HOST: 0.0.0.0
      PORT: 8080
    volumes:
      - ./workspace/members:/app/members
      - ./pkg:/pkg
    ports:
      - "${MEMBERS_PORT:-8082}:8080"
    depends_on:
      - db
      - redis
      - rabbitmq
      - users
    links:
      - db
      - redis
      - rabbitmq
      - users
